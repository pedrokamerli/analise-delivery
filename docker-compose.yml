services:
  analise-delivery:
    build:
      context: .
      dockerfile: Dockerfile
    image: analise-delivery:latest
    container_name: analise-delivery
    restart: unless-stopped
    environment:
      DELIVERY_PUBLICO: "1"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    expose:
      - "8501"
    networks:
      - proxy-compartilhado

networks:
  proxy-compartilhado:
    external: true
    name: ${PROXY_NETWORK:-evolync_network}
