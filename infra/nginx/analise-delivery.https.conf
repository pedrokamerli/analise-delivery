server {
    listen 80;
    listen [::]:80;
    server_name analise-delivery.pedromerli.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name analise-delivery.pedromerli.com;

    ssl_certificate /etc/letsencrypt/live/analise-delivery.pedromerli.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/analise-delivery.pedromerli.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/analise-delivery.pedromerli.com/chain.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://analise-delivery:8501;
        include /etc/nginx/conf.d/proxy_params.conf;
    }
}
