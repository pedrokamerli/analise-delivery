server {
    listen 80;
    listen [::]:80;
    server_name analise-delivery.pedromerli.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://analise-delivery:8501;
        include /etc/nginx/conf.d/proxy_params.conf;
    }
}
